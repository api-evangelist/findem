aid: findem
name: Findem
url: https://raw.githubusercontent.com/api-evangelist/findem/refs/heads/main/apis.yml
description: >-
  Findem is an AI Talent Intelligence platform that blends assistive AI for
  sourcing, marketing, executive search, and analytics with agentic AI workers
  for intelligent job posting, application boost, screening, and scheduling. The
  company also exposes Embedded AI building blocks (AI Job Board, Sourcing
  Copilot, Labeling Engine, Agents, and MCP) for partners to ship branded AI
  hiring experiences. Findem is sold enterprise-direct; ATS, HRIS, and partner
  integrations are gated rather than offered through a public self-serve
  developer portal.
kind: company
